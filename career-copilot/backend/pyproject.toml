[project]
name = "career-copilot-backend"
version = "0.1.0"
description = "Multi-agent career assistant: resume parsing, tailoring, truthfulness verification and ATS optimization"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
