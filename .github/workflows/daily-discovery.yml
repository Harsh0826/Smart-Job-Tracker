# Daily job discovery at 08:00 America/Toronto.
# GitHub cron runs in UTC, so one trigger covers EST (13:00 UTC) and one covers EDT (12:00 UTC).
# The first step skips whichever one is not 08:xx in Toronto.
#
# Needs the repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and DISCOVERY_USER_ID.
# The job is skipped until they are set.
name: Daily job discovery

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check time and configuration
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.DISCOVERY_USER_ID != '' }}
        working-directory: .
        run: |
          hour=$(TZ=America/Toronto date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not 08:00 in Toronto (hour=$hour); skipping."; exit 0
          fi
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::warning::Discovery secrets not configured; skipping."; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Run discovery
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_USER_ID: ${{ secrets.DISCOVERY_USER_ID }}
          # config/env.ts requires these on import, but discovery does not use them.
          AWS_REGION: ca-central-1
          AWS_S3_RESUME_BUCKET: unused-by-discovery
          OPENAI_API_KEY: unused-by-discovery
          NODE_ENV: production
        run: npm run build && npm run discovery:prod
